<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mousey AR Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --progress-bar-color: #667eea;
    }
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      z-index: 10;
      width: 90%;
      max-width: 300px;
    }
    .ar-button, .ar-link {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
    }
    .ar-button:active, .ar-link:active { transform: scale(0.96); }
    .learn-button {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(17, 153, 142, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }
    .learn-button.talking {
      background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
    }
    .info-text {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      z-index: 20;
      max-width: 90%;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loading-text {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 18px;
      margin-top: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading Mousey... 🐭</div>
  </div>

  <div class="info-text" id="info">
    👆 Tap "View in AR" to place Mousey in your room!
  </div>
  
  <model-viewer
    id="model"
    src="/models/fox-avatar.glb"
    alt="Mousey 3D character"
    camera-controls
    auto-rotate
    rotation-per-second="30deg"
    shadow-intensity="1.5"
    exposure="1"
    camera-orbit="0deg 80deg 2m"
    field-of-view="35deg"
    style="width: 100%; height: 100%;"
  >
    <div class="controls">
      <button id="learn-btn" class="learn-button" onclick="toggleTalking()">
        ▶️ Start Learning
      </button>
      <a id="ar-link" class="ar-link" href="#">
        📱 View in AR
      </a>
    </div>
  </model-viewer>

  <script>
    const modelViewer = document.getElementById('model');
    const loadingEl = document.getElementById('loading');
    const infoEl = document.getElementById('info');
    const learnBtn = document.getElementById('learn-btn');
    const arLink = document.getElementById('ar-link');
    
    let isTalking = false;
    let talkingTimeout = null;
    let currentModel = 'idle';

    // Get the full model URL
    const baseUrl = window.location.origin;
    const idleModelUrl = `${baseUrl}/models/fox-avatar.glb`;
    const talkingModelUrl = `${baseUrl}/models/mousey-talking.glb`;

    // Build Scene Viewer intent URL for proper AR placement
    function getSceneViewerUrl(modelUrl) {
      const params = new URLSearchParams({
        file: modelUrl,
        mode: 'ar_preferred',
        resizable: 'false',
        enable_vertical_placement: 'false',
        disable_occlusion: 'false'
      });
      return `intent://arvr.google.com/scene-viewer/1.0?${params.toString()}#Intent;scheme=https;package=com.google.android.googlequicksearchbox;action=android.intent.action.VIEW;S.browser_fallback_url=${encodeURIComponent(baseUrl)};end;`;
    }

    // Update AR link
    function updateARLink() {
      const modelUrl = currentModel === 'talking' ? talkingModelUrl : idleModelUrl;
      arLink.href = getSceneViewerUrl(modelUrl);
    }

    // Initialize AR link
    updateARLink();

    // Hide loading when model is ready
    modelViewer.addEventListener('load', () => {
      loadingEl.classList.add('hidden');
    });

    function toggleTalking() {
      if (isTalking) {
        stopTalking();
      } else {
        startTalking();
      }
    }

    function startTalking() {
      isTalking = true;
      currentModel = 'talking';
      modelViewer.src = '/models/mousey-talking.glb';
      modelViewer.autoRotate = false;
      learnBtn.innerHTML = '⏹️ Stop Lesson';
      learnBtn.classList.add('talking');
      infoEl.textContent = '🎓 Mousey is teaching! Listen carefully...';
      updateARLink();
      
      talkingTimeout = setTimeout(() => {
        stopTalking();
      }, 60000);
    }

    function stopTalking() {
      isTalking = false;
      currentModel = 'idle';
      if (talkingTimeout) {
        clearTimeout(talkingTimeout);
        talkingTimeout = null;
      }
      modelViewer.src = '/models/fox-avatar.glb';
      modelViewer.autoRotate = true;
      learnBtn.innerHTML = '▶️ Start Learning';
      learnBtn.classList.remove('talking');
      infoEl.textContent = '👆 Tap "View in AR" to place Mousey in your room!';
      updateARLink();
    }

    // Fallback: hide loading after 5 seconds
    setTimeout(() => {
      loadingEl.classList.add('hidden');
    }, 5000);
  </script>
</body>
</html>
