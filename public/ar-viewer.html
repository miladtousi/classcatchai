<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mousey AR Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }
    .ar-button {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .ar-button:active {
      background-color: #45a049;
    }
    .ar-prompt {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      text-align: center;
      font-family: Arial, sans-serif;
      display: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <model-viewer
    id="model"
    src="./models/fox-avatar.glb"
    alt="Mousey 3D character"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    ar-placement="floor"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    shadow-softness="1"
    exposure="1"
    environment-image="neutral"
    style="width: 100%; height: 100%;"
  >
    <button slot="ar-button" class="ar-button">
      👆 View in AR
    </button>
  </model-viewer>

  <div class="ar-prompt" id="ar-prompt">
    Point your camera at the floor and tap to place Mousey! 🐭
  </div>

  <script>
    const modelViewer = document.getElementById('model');
    const arPrompt = document.getElementById('ar-prompt');

    modelViewer.addEventListener('ar-status', (event) => {
      if (event.detail.status === 'session-started') {
        arPrompt.style.display = 'block';
        setTimeout(() => {
          arPrompt.style.display = 'none';
        }, 4000);
      } else {
        arPrompt.style.display = 'none';
      }
    });
  </script>
</body>
</html>
